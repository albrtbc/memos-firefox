name: Build Extensions

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
    secrets:
      AMO_JWT_ISSUER:
        required: false
      AMO_JWT_SECRET:
        required: false
  workflow_dispatch:

jobs:
  build-firefox:
    name: Build .xpi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: version
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Build .xpi
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FILENAME="memos-firefox_${VERSION}.xpi"
          zip -r "${FILENAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".release-please-manifest.json" \
            -x "release-please-config.json" \
            -x "CHANGELOG.md" \
            -x ".gitignore" \
            -x "manifest.chrome.json" \
            -x "*.xpi" \
            -x "*.zip"
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV
          echo "Built: ${FILENAME} ($(du -h "${FILENAME}" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 60

      - name: Upload to GitHub Release
        if: inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ${{ env.FILENAME }}

      - name: Setup Node.js
        if: inputs.tag_name != '' && secrets.AMO_JWT_ISSUER != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish to AMO
        if: inputs.tag_name != '' && secrets.AMO_JWT_ISSUER != ''
        run: npx web-ext sign --source-dir . --artifacts-dir ./artifacts --channel listed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

  build-chrome:
    name: Build .zip (Chrome)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: version
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Prepare Chrome manifest
        run: cp manifest.chrome.json manifest.json

      - name: Build .zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FILENAME="memos-chrome_${VERSION}.zip"
          zip -r "${FILENAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".release-please-manifest.json" \
            -x "release-please-config.json" \
            -x "CHANGELOG.md" \
            -x ".gitignore" \
            -x "manifest.chrome.json" \
            -x "*.xpi" \
            -x "*.zip"
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV
          echo "Built: ${FILENAME} ($(du -h "${FILENAME}" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 60

      - name: Upload to GitHub Release
        if: inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: ${{ env.FILENAME }}
